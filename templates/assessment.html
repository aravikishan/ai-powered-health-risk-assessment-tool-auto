<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Risk Assessment</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/5.1.3/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header>
        <h1>AI-Powered Health Risk Assessment Tool</h1>
    </header>
    <nav>
        <a href="/">Home</a>
        <a href="/profile">Profile</a>
        <a href="/assessment">Assessment</a>
        <a href="/api-docs">API Docs</a>
        <a href="/about">About</a>
    </nav>
    <main class="container">
        <h1 class="mt-5">Health Risk Assessment</h1>
        <div id="assessment-result">
            <!-- Assessment results will be displayed here -->
        </div>
    </main>
    <footer>
        <p>&copy; 2023 Health Assessment Tool</p>
    </footer>
    <script src="/static/js/main.js"></script>
    <script>
        fetch('/api/assessments/1')
            .then(response => response.json())
            .then(data => {
                const resultDiv = document.getElementById('assessment-result');
                resultDiv.innerHTML = `<h2>Risk Score: ${data.risk_score}</h2>`;
                resultDiv.innerHTML += '<h3>Recommendations:</h3><ul>' + data.recommendations.map(rec => `<li>${rec}</li>`).join('') + '</ul>';
            })
            .catch(error => console.error('Error:', error));
    </script>
</body>
</html>
